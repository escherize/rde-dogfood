description: 'One row per Stripe refund (key: refund_id). Sources: raw_stripe.refund, fct_stripe_charge, cfg_stripe_core. Definition: a refund in its own currency, major units; is_revenue_refund marks money returned (live mode and status = succeeded). Caveats: loader-deleted rows dropped (D1); test-mode kept and flagged, never counted (D2); only succeeded refunds count (D4); the refund''s own currency and month are used even when the charge differs, flagged currency_matches_charge (D7); a refund whose charge is deleted or missing is still counted, flagged charge_link = unknown_or_deleted (D7); exceeds_charge_amount flags refunds larger than their charge, not corrected; last month flagged is_complete_month = false (D6).'
