- name: test-mode and non-succeeded refunds are never counted
  sql: SELECT f.refund_id FROM stripe_core.fct_stripe_refund f WHERE f.is_revenue_refund AND (NOT f.is_livemode OR f.refund_status <> 'succeeded')
  type: empty
