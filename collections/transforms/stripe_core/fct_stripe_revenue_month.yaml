description: 'Draft. One row per currency and month (key: currency_month_key, dense from the first to the last month with activity). Sources: fct_stripe_charge, fct_stripe_refund, cfg_stripe_core. Definition: net_collected_amount = gross_collected_amount (live succeeded charges, by charge month) minus refunded_amount (live succeeded refunds, by refund month), in the currency''s own units. Caveats: never summed or converted across currencies (D5); test-mode and loader-deleted rows excluded (D1, D2); revenue by status not the paid flag (D3); refunds from the refund table, counted even when their charge is deleted (D4, D7); the month after the last complete month (2024-12) is flagged is_complete_month = false (D6); net can be negative.'
