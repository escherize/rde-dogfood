description: 'One row per Stripe charge attempt (key: charge_id). Sources: raw_stripe.charge, dim_stripe_customer, cfg_stripe_core. Definition: a charge in its own currency, major units; is_revenue_charge marks money collected (live mode and status = succeeded). Caveats: loader-deleted rows dropped (D1); test-mode rows kept and flagged, never revenue (D2); revenue by status, not the paid flag (D3); no cross-currency conversion (D5); amount_refunded_reported is the raw charge column and is unreliable, refunds come from fct_stripe_refund (D4); customer_link none/known/unknown_or_deleted (63 raw charges have no customer id); last month flagged is_complete_month = false (D6). Constants from cfg_stripe_core.'
