source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: Stripe customer (live record, not deleted by the loader)
        -- Key:         customer_id
        -- Sources:     raw_stripe.customer
        -- Definition:  a customer as Stripe knows them, personal fields reduced (no name, email, phone, address)
        -- Caveats:     rows with _fivetran_deleted = true are dropped (D1); email reduced to email_domain and has_email (D8, masked by default); test-mode customers kept, flagged is_livemode; balance in the customer's own currency, major units
        WITH stg_customer AS (
          SELECT
            c.id                                            AS customer_id,
            NULLIF(lower(trim(split_part(c.email, '@', 2))), '') AS email_domain,
            (c.email IS NOT NULL AND trim(c.email) <> '')   AS has_email,
            lower(trim(c.currency))                         AS currency,
            c.balance / 100.0                               AS customer_balance,
            COALESCE(c.delinquent, false)                   AS is_delinquent,
            lower(trim(c.tax_exempt))                       AS tax_exempt_status,
            COALESCE(c.livemode, false)                     AS is_livemode,
            c.created                                       AS created_at
          FROM raw_stripe.customer c
          WHERE NOT COALESCE(c._fivetran_deleted, false)
        )
        SELECT
          s.customer_id,
          s.email_domain,
          s.has_email,
          s.currency,
          s.customer_balance,
          s.is_delinquent,
          s.tax_exempt_status,
          s.is_livemode,
          s.created_at,
          date_trunc('month', s.created_at)::date AS created_month
        FROM stg_customer s
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
