description: 'One row per Stripe customer (key: customer_id). Sources: raw_stripe.customer. Definition: a live (not loader-deleted) customer with personal fields reduced to email_domain and has_email. Caveats: _fivetran_deleted rows dropped (D1); name, email, phone not carried (D8, masked by default, to confirm); test-mode customers kept and flagged is_livemode; customer_balance in the customer''s own currency, major units (raw is integer minor units / 100).'
