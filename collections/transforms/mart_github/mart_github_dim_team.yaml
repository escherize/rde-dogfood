description: |
  One row per GitHub team (key: team_id). Sources: raw_github.team, raw_github.team_membership (member count only). Definition: teams; active_member_count = distinct users with a live membership in state active (D6). Caveats: source-deleted teams kept and flagged (4 of 10); team names are not unique across organizations ('Data' appears twice); pending memberships do not count.
