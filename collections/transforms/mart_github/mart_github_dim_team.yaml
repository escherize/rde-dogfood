source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: GitHub team
        -- Key:         team_id
        -- Sources:     raw_github.team, raw_github.team_membership (member count only)
        -- Definition:  teams people belong to; active_member_count = live memberships in state 'active' (D6)
        -- Caveats:     source-deleted teams KEPT and flagged is_deleted_in_source (4 of 10; 'Data' appears twice, one live one deleted); team names are not unique across organizations; pending invitations do not count as members.
        SELECT
          t.id                 AS team_id,
          t.name               AS team_name,
          t.privacy            AS team_privacy,
          t.created_at         AS team_created_at,
          t._fivetran_deleted  AS is_deleted_in_source,
          (SELECT count(DISTINCT m.user_id) FROM raw_github.team_membership m
            WHERE m.team_id = t.id AND NOT m._fivetran_deleted AND m.state = 'active') AS active_member_count
        FROM raw_github.team t
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
