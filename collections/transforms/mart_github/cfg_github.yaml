description: |
  One row (constants). Sources: none. Definition: constants for the GitHub marts: last_complete_month = 2024-11-01 and cap_month = 2024-12-01 (first month NOT complete), pinned to the extract (newest PR created 2024-12-01), not current_date; large_pr_lines = 1000. Caveats: re-pin after every reload of raw_github.
