source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: constant set (one row)
        -- Key:         none (single row)
        -- Sources:     none (literals)
        -- Definition:  constants read by the GitHub marts
        -- Caveats:     freshness pinned to the extract, not current_date; update when raw_github reloads
        SELECT
          DATE '2024-11-01'                                         AS last_complete_month,
          DATE '2024-12-01'                                         AS cap_month,
          'max(pull_request.created_at)=2024-12-01, 1 day of Dec; pinned to the extract' AS last_complete_month_note,
          1000                                                      AS large_pr_lines,
          'D-default: PRs over 1000 changed lines are Large'        AS large_pr_lines_note
      lib/type: mbql.stage/native
    lib/type: mbql/query
