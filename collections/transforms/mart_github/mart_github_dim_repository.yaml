source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: GitHub repository
        -- Key:         repository_id
        -- Sources:     raw_github.repository
        -- Definition:  repositories PRs, commits, deployments and workflow runs belong to
        -- Caveats:     source-deleted repositories are KEPT and flagged is_deleted_in_source so every PR resolves its repository (D4); language null on 5 of 24 live repos
        SELECT
          r.id                      AS repository_id,
          r.name                    AS repository_name,
          r.full_name               AS repository_full_name,
          r.language                AS primary_language,
          r.private                 AS is_private,
          r.fork                    AS is_fork,
          r.archived                AS is_archived,
          r.default_branch          AS default_branch,
          r.created_at              AS repository_created_at,
          r._fivetran_deleted       AS is_deleted_in_source
        FROM raw_github.repository r
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
