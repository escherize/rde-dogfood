description: |
  One row per CI workflow run not deleted in the source (key: workflow_run_id). Sources: raw_github.workflow_run, raw_github.workflow (name), cfg_github. Definition: judged by conclusion, status ignored (D8); decided = success, failure or timed_out; is_failed = failure or timed_out; CI success rate = success / decided (D11). Caveats: _fivetran_deleted runs excluded (D1, 500 of 1000); status and conclusion independent in the source; cancelled/skipped/neutral/action_required/no-conclusion runs kept but not decided; 213 of 500 live runs belong to workflows deleted in the source (kept, flagged); no duration column because started_at precedes created_at on about half the runs. Constants: cfg_github.cap_month.
