source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: deployment not deleted in the source
        -- Key:         deployment_id
        -- Sources:     raw_github.deployment, analytics.cfg_github
        -- Definition:  PRODUCTION = environment named 'production' (D9); the source production_environment flag is kept but not used (it agrees with the name on only 9 of 17 named-production rows). ROLLBACK = task 'deploy:rollback'. Rollbacks count as production deployments; change failure rate = production rollbacks / production deployments (D12).
        -- Caveats:     _fivetran_deleted deployments excluded (D1, 97 of 200); no deployment sha matches any PR merge commit or commit, so merge-to-deploy lead time is not possible; 17 production rows in total (8 deploy, 5 migrations, 4 rollback); months from cfg_github.cap_month are incomplete.
        SELECT
          d.id                                              AS deployment_id,
          d.repository_id                                   AS repository_id,
          d.creator_id                                      AS creator_user_id,
          d.environment                                     AS environment,
          d.task                                            AS task,
          d.production_environment                          AS source_production_flag,
          d.created_at                                      AS created_at,
          CAST(date_trunc('month', d.created_at) AS date)   AS created_month,
          (CAST(date_trunc('month', d.created_at) AS date) < c.cap_month) AS created_in_complete_month,
          (d.environment = 'production')                    AS is_production,
          (d.task = 'deploy:rollback')                      AS is_rollback,
          (d.environment = 'production' AND d.task = 'deploy:rollback') AS is_production_rollback
        FROM raw_github.deployment d
        CROSS JOIN analytics.cfg_github c
        WHERE NOT d._fivetran_deleted
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
