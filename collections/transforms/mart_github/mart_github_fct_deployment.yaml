description: |
  One row per deployment not deleted in the source (key: deployment_id). Sources: raw_github.deployment, cfg_github. Definition: PRODUCTION = environment named 'production' (D9; the source production_environment flag is kept but unused); ROLLBACK = task deploy:rollback; rollbacks count as production deployments; change failure rate = production rollbacks / production deployments (D12). Caveats: _fivetran_deleted excluded (D1, 97 of 200); no deployment matches any PR or commit sha, so merge-to-deploy lead time is not possible; 17 production rows (8 deploy, 5 migrations, 4 rollback). Constants: cfg_github.cap_month.
