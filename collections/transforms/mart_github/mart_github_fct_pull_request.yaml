description: |
  One row per pull request not deleted in the source (key: pull_request_id). Sources: raw_github.pull_request, mart_github_dim_user, cfg_github. Definition: MERGED = merged_at present (D2), counted in the month of merged_at; source merged flag/state/closed_at kept but unused because they contradict merged_at; hours_to_merge = merged_at - created_at only when merged_at >= created_at (D7). Caveats: _fivetran_deleted rows excluded (D1, 148 of 300); 31 of 71 merged PRs have merged_at before created_at, flagged is_merged_before_created and given no hours_to_merge; author_type 'Unknown' when the author is not in dim_user; months from cfg_github.cap_month on are incomplete; lines are as reported on the PR. Constants: cfg_github.cap_month = 2024-12-01, large_pr_lines = 1000.
