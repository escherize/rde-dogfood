source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: GitHub account (user, bot, or organization account)
        -- Key:         user_id
        -- Sources:     raw_github.user
        -- Definition:  GitHub accounts that author PRs, reviews, commits. Login only: no email, display name, company, location or bio (D5).
        -- Caveats:     source-deleted accounts are KEPT and flagged is_deleted_in_source, so every PR author resolves (D4); account_type is User/Bot/Organization as GitHub reports it.
        SELECT
          u.id                      AS user_id,
          u.login                   AS github_login,
          u.type                    AS account_type,
          (u.type = 'Bot')          AS is_bot,
          u.site_admin              AS is_site_admin,
          u.created_at              AS account_created_at,
          u._fivetran_deleted       AS is_deleted_in_source
        FROM raw_github."user" u
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
