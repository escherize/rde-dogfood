description: |
  One row per review on a live PR, review not deleted in the source (key: review_id). Sources: raw_github.pull_request_review, mart_github_fct_pull_request, cfg_github. Definition: COUNTED review = not PENDING and submitted at/after its PR was created (D10); hours_to_review = submitted_at - PR created_at for counted reviews; FIRST review = earliest counted review of a PR. Caveats: _fivetran_deleted reviews and reviews of deleted PRs excluded (D1); 37 PENDING and 48 pre-creation reviews kept but not counted; self-reviews flagged not excluded; months from cfg_github.cap_month incomplete. Constants: cfg_github.cap_month.
