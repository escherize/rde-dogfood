description: 'One row per deployment live in the source (key: deployment_id). Sources: raw_github.deployment, zz_ignacio.cfg_github. Definition: a production deployment is one whose environment is production (D6); a rollback is task deploy:rollback. Caveats: Fivetran-deleted deployments excluded, 97 of 200 (D1); the source production flag is kept as source_production_flag and matches the environment name on only 9 deployments (17 by name, 53 by flag) (D6); migration tasks in production count as production deployments; months after 2024-11 flagged incomplete. Self-consistent only, no external reference; D1 D6 confirmed 2026-10-19.'
