source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: deployment live in the source (Fivetran-deleted deployments excluded)
        -- Key:         deployment_id
        -- Sources:     raw_github.deployment, zz_ignacio.cfg_github
        -- Definition:  a production deployment is one with environment = 'production' (D6); a rollback is task = 'deploy:rollback'
        -- Caveats:     D1 Fivetran-deleted deployments excluded (97 of 200). D6 production reads the environment name; the source production_environment flag is kept as source_production_flag and the two agree on only 9 deployments (17 by name, 53 by flag). Task deploy:migrations counts as a production deployment when its environment is production. Months after cfg_github.last_complete_month are flagged incomplete.
        SELECT
          d.id                                              AS deployment_id,
          d.repository_id                                   AS repository_id,
          d.creator_id                                      AS creator_user_id,
          d.environment                                     AS environment,
          d.task                                            AS task,
          d.production_environment                          AS source_production_flag,
          d.created_at                                      AS created_at,
          CAST(date_trunc('month', d.created_at) AS date)   AS created_month,
          (CAST(date_trunc('month', d.created_at) AS date) <= c.last_complete_month) AS created_in_complete_month,
          (d.environment = 'production')                    AS is_production,
          (d.task = 'deploy:rollback')                      AS is_rollback,
          (d.environment = 'production' AND d.task = 'deploy:rollback') AS is_production_rollback
        FROM raw_github.deployment d
        CROSS JOIN zz_ignacio.cfg_github c
        WHERE NOT d._fivetran_deleted
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
