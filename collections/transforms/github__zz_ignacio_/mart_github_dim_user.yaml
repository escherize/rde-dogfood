description: 'One row per GitHub account (key: user_id). Sources: raw_github.user. Definition: public login and account type of each account, including accounts Fivetran marked deleted (flagged is_deleted_in_source). Caveats: email, name, company, location and bio are deliberately not carried (personal data masked); is_bot means account type = Bot. Self-consistent only, no external reference; D1 confirmed 2026-10-19.'
