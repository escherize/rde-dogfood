source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: GitHub account (all accounts, including ones deleted in the source)
        -- Key:         user_id
        -- Sources:     raw_github."user"
        -- Definition:  the public handle and type of each account; Fivetran-deleted accounts kept and flagged
        -- Caveats:     no email, name, company, location or bio carried (personal data masked); is_bot is account type = 'Bot'
        SELECT
          u.id               AS user_id,
          u.login            AS github_login,
          u.type             AS account_type,
          (u.type = 'Bot')   AS is_bot,
          u.site_admin       AS is_site_admin,
          u.created_at       AS account_created_at,
          u._fivetran_deleted AS is_deleted_in_source
        FROM raw_github."user" u
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
