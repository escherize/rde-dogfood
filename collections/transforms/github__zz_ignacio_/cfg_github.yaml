source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: configuration set (exactly one row)
        -- Key:         none (single row)
        -- Sources:     none (constants)
        -- Definition:  named constants read by every GitHub model
        -- Caveats:     last_complete_month pinned to the extract: newest raw_github row is 2024-12-01, one day of December; large_pr_lines is a default to confirm (D8)
        SELECT
          DATE '2024-11-01' AS last_complete_month,
          'Pinned to extract: max(pull_request.created_at)=2024-12-01 18:56, 1 day of Dec' AS last_complete_month_note,
          DATE '2024-12-01' AS cap_month,
          'First, incomplete month in the extract' AS cap_month_note,
          10000 AS large_pr_lines,
          'D8 default: PRs over 10000 changed lines (additions + deletions) are Large; 1000 flags all 152 live PRs (min is 1029)' AS large_pr_lines_note
      lib/type: mbql.stage/native
    lib/type: mbql/query
