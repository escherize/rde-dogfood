description: 'One row per pull request live in the source (key: pull_request_id). Sources: raw_github.pull_request, raw_github.repository, zz_ignacio.cfg_github. Definition: a PR is merged when merged_at is filled (D2); hours_to_merge runs created_at to merged_at. Caveats: Fivetran-deleted PRs excluded, 152 of 300 (D1); the source merged flag is kept as source_merged_flag and agrees with merged_at on only 35 PRs (D2); 31 merged PRs carry a merged_at before created_at, stay merged but have null hours_to_merge and is_merged_before_created = true (D3); PRs in repositories deleted in the source are kept and flagged (D4); large PR = additions + deletions over 10000 (D8; 1000 flags every PR). Months after 2024-11 are flagged incomplete, not dropped; no title, body or branch text carried. Self-consistent only, no external reference; D1 D2 D3 D4 D8 confirmed 2026-10-19.'
