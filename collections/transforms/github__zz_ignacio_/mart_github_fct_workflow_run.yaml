description: 'One row per CI workflow run live in the source (key: workflow_run_id). Sources: raw_github.workflow_run, raw_github.workflow, zz_ignacio.cfg_github. Definition: a run succeeded when conclusion = success whatever its status (D5); failed when conclusion is failure or timed_out; decided when it succeeded or failed (D9). Caveats: Fivetran-deleted runs excluded, 500 of 1000 (D1); cancelled, skipped, neutral, action_required and empty conclusions are undecided, not failures (D9); runs of a workflow deleted in the source are kept and flagged; no duration (started_at precedes created_at on 265 of 500 runs); months after 2024-11 flagged incomplete. Self-consistent only, no external reference; D1 D5 D9 confirmed 2026-10-19.'
