source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: GitHub repository (all repositories, including ones deleted in the source)
        -- Key:         repository_id
        -- Sources:     raw_github.repository
        -- Definition:  descriptive attributes of each repository; Fivetran-deleted repositories are kept and flagged so facts can still join to them
        -- Caveats:     D1 (provisional): deleted repositories flagged, not removed; no owner or description text carried
        SELECT
          r.id                          AS repository_id,
          r.name                        AS repository_name,
          r.full_name                   AS repository_full_name,
          COALESCE(r.language, 'Unknown') AS primary_language,
          r.private                     AS is_private,
          r.fork                        AS is_fork,
          r.archived                    AS is_archived,
          r.default_branch              AS default_branch,
          r.created_at                  AS repository_created_at,
          r._fivetran_deleted           AS is_deleted_in_source
        FROM raw_github.repository r
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
