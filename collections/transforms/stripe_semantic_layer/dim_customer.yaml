source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: Stripe customer
        -- Key:         customer_id
        -- Sources:     stripe_data.customer, stripe_data.subscription
        -- Definition:  A Stripe customer with its home currency, delinquency flag and number of subscriptions ever created. No names or emails (D6).
        -- Caveats:     Soft-deleted customers (_fivetran_deleted) are excluded (none today). Names and emails are deliberately left out until the audience is confirmed.
        SELECT
          cu.id AS customer_id,
          cu.created AS customer_created_at,
          date_trunc('month', cu.created)::date AS customer_created_month,
          cu.currency AS home_currency,
          COALESCE(cu.delinquent, false) AS is_delinquent,
          COALESCE(sb.subscription_count, 0) AS subscription_count
        FROM stripe_data.customer cu
        LEFT JOIN (
          SELECT s.customer_id, count(*) AS subscription_count
          FROM stripe_data.subscription s
          WHERE NOT s._fivetran_deleted
          GROUP BY s.customer_id
        ) sb ON sb.customer_id = cu.id
        WHERE NOT cu._fivetran_deleted
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
