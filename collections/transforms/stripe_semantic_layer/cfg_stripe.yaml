source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: constant set (single row)
        -- Key:         cfg_key
        -- Sources:     none (literals)
        -- Definition:  Constants for the Stripe semantic layer: minor-unit divisor, fixed FX to USD, last complete month.
        -- Caveats:     FX is a fixed 2024-average, no FX table in the warehouse (D4). last_complete_month pinned to the extract: max(created) on stripe_data.charge and invoice is 2024-12-31 (not current_date).
        SELECT
          'stripe' AS cfg_key,
          100 AS minor_unit_divisor,
          'D4: Stripe amounts are minor units (cents); all five currencies have 2 decimals' AS minor_unit_divisor_note,
          1.000::numeric(10,4) AS usd_per_usd,
          1.082::numeric(10,4) AS usd_per_eur,
          1.278::numeric(10,4) AS usd_per_gbp,
          0.730::numeric(10,4) AS usd_per_cad,
          0.660::numeric(10,4) AS usd_per_aud,
          'D4: fixed 2024-average FX, same rates as analytics.cfg_stripe; no FX table in warehouse' AS fx_note,
          DATE '2024-12-01' AS last_complete_month,
          'Pinned to extract: max(created) of stripe_data.charge and stripe_data.invoice = 2024-12-31' AS last_complete_month_note
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
