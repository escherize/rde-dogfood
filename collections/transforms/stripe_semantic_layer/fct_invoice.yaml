source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: Stripe invoice
        -- Key:         invoice_id
        -- Sources:     stripe_data.invoice, stripe_semantic.cfg_stripe
        -- Definition:  Every invoice with amount due, paid and still open, in local currency and USD. Paid-invoice amounts count only status 'paid'.
        -- Caveats:     Separate from charge revenue (D2): charges carry no invoice link, so the two do not reconcile row by row. Open amount counts status 'open' only; void and uncollectible invoices carry amount_due but no open amount. USD at fixed 2024-average FX (D4). Month = created, UTC; later months flagged is_complete_period = false.
        SELECT
          i.id AS invoice_id,
          i.customer_id AS customer_id,
          i.subscription_id AS subscription_id,
          i.status AS invoice_status,
          (i.status = 'paid') AS is_paid_invoice,
          i.currency AS invoice_currency,
          i.created AS invoice_created_at,
          date_trunc('month', i.created)::date AS invoice_month,
          (date_trunc('month', i.created)::date <= cfg.last_complete_month) AS is_complete_period,
          i.due_date AS invoice_due_at,
          cx.fx_usd_per_unit AS fx_usd_per_unit,
          round(i.amount_due::numeric / cfg.minor_unit_divisor, 2) AS amount_due_local,
          round(i.amount_due::numeric / cfg.minor_unit_divisor * cx.fx_usd_per_unit, 2) AS amount_due_usd,
          CASE WHEN i.status = 'paid' THEN round(i.amount_paid::numeric / cfg.minor_unit_divisor * cx.fx_usd_per_unit, 2) ELSE 0 END AS amount_paid_usd,
          CASE WHEN i.status = 'open' THEN round(i.amount_remaining::numeric / cfg.minor_unit_divisor * cx.fx_usd_per_unit, 2) ELSE 0 END AS amount_open_usd
        FROM stripe_data.invoice i
        CROSS JOIN stripe_semantic.cfg_stripe cfg
        CROSS JOIN LATERAL (
          SELECT CASE i.currency
            WHEN 'usd' THEN cfg.usd_per_usd
            WHEN 'eur' THEN cfg.usd_per_eur
            WHEN 'gbp' THEN cfg.usd_per_gbp
            WHEN 'cad' THEN cfg.usd_per_cad
            WHEN 'aud' THEN cfg.usd_per_aud
          END AS fx_usd_per_unit
        ) cx
        WHERE NOT i._fivetran_deleted
      lib/type: mbql.stage/native
    lib/type: mbql/query
