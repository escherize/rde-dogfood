description: |
  One row per discount code (key: discount_id). Sources: raw_shopify.discounts. Definition: Shopify discount codes with positive percent_off (percentage codes) or amount_off_usd (fixed-amount codes), a discount_kind label (creator, seasonal, evergreen, internal, other) and the lifetime redemption_count. Caveats: Draft, provisional decisions D1-D4. No rows removed; internal codes STAFF40, SORRY15, FREESHIPJUNE flagged by discount_kind (D2). redemption_count is a lifetime total as of usage_synced_at, so it cannot be sliced by period (D4). Value flipped from negative to positive and split by type (D3). USD only. Active status is not stored; Metabase segments evaluate it at query time (D1). discount_kind rules: title starts 'Creator code' = creator; the three internal codes; code starts BFCM/SUMMER/SPRING = seasonal; no end date = evergreen; else other.
entity_id: VSXaaPNah2J2fsGW_dimi
