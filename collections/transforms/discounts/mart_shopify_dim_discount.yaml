name: mart_shopify_dim_discount
owner_user_id: api-key-user-4fa708cd-e2da-4245-98d4-161322109820@api-key.invalid
source:
  query:
    database: warehouse
    stages:
    - native: |
        -- One row per: discount code
        -- Key:         discount_id
        -- Sources:     raw_shopify.discounts
        -- Definition:  Shopify discount codes with positive percent_off / amount_off_usd, a kind label and lifetime redemption count.
        -- Caveats:     redemption_count is a lifetime total as of usage_synced_at, not an event stream. kind is a rule (D2).
        --              No filter: all rows kept, internal codes flagged. USD only. Active status is NOT stored; computed at query time (D1).
        WITH src AS (
          SELECT
            d.id                    AS discount_id,
            d.code                  AS discount_code,
            d.title                 AS discount_title,
            d.value_type            AS discount_type,
            abs(d.value)            AS abs_value,
            d.target_type           AS applies_to,
            d.once_per_customer     AS is_once_per_customer,
            d.usage_count           AS redemption_count,
            d.starts_at             AS starts_at,
            d.ends_at               AS ends_at,
            d.created_at            AS created_at,
            d.updated_at            AS updated_at,
            d._fivetran_synced      AS usage_synced_at
          FROM raw_shopify.discounts d
        )
        SELECT
          s.discount_id,
          s.discount_code,
          s.discount_title,
          CASE
            WHEN s.discount_title ILIKE 'Creator code%'                                   THEN 'creator'
            WHEN s.discount_code IN ('STAFF40', 'SORRY15', 'FREESHIPJUNE')                THEN 'internal'
            WHEN s.discount_code ~ '^(BFCM|SUMMER|SPRING)'                                THEN 'seasonal'
            WHEN s.ends_at IS NULL                                                        THEN 'evergreen'
            ELSE 'other'
          END                                                                             AS discount_kind,
          s.discount_type,
          CASE WHEN s.discount_type = 'percentage'   THEN s.abs_value END                 AS percent_off,
          CASE WHEN s.discount_type = 'fixed_amount' THEN s.abs_value END                 AS amount_off_usd,
          s.applies_to,
          s.is_once_per_customer,
          s.redemption_count,
          s.starts_at,
          s.ends_at,
          s.created_at,
          s.updated_at,
          s.usage_synced_at
        FROM src s
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
