source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: configuration set (a single row, cfg_key = 'stripe')
        -- Key:         cfg_key
        -- Sources:     none (constants)
        -- Definition:  constants read by every stripe_transforms model: minor-unit divisor, fixed FX to USD, last complete month
        -- Caveats:     FX is a fixed 2024-average rate set copied from analytics.cfg_stripe_v2 (D5, PROVISIONAL); no FX table exists in the warehouse.
        --              last_complete_month is pinned to the extract, not to current_date (D3, PROVISIONAL).
        SELECT
          'stripe'::text                                  AS cfg_key,
          100                                             AS minor_unit_divisor,
          'Stripe amounts are minor units (cents); all five currencies in stripe_data have 2 decimals'::text AS minor_unit_divisor_note,
          1.0::numeric(10, 4)                             AS usd_per_usd,
          1.082::numeric(10, 4)                           AS usd_per_eur,
          1.278::numeric(10, 4)                           AS usd_per_gbp,
          0.73::numeric(10, 4)                            AS usd_per_cad,
          0.66::numeric(10, 4)                            AS usd_per_aud,
          'D5 PROVISIONAL: fixed 2024-average FX, same rates as analytics.cfg_stripe_v2; no FX table in warehouse'::text AS fx_note,
          DATE '2024-12-01'                               AS last_complete_month,
          'D3 PROVISIONAL: pinned to extract; max(created) of stripe_data.charge = 2024-12-31 16:42 and stripe_data.invoice = 2024-12-31 20:12'::text AS last_complete_month_note
      lib/type: mbql.stage/native
    lib/type: mbql/query
