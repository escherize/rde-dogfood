description: |
  Draft. One row per Stripe customer (key: customer_id). Sources: stripe_data.customer, stripe_data.subscription, cfg_stripe. Definition: customer attributes (created, currency, balance in major units, delinquent flag) and subscription counts (total, not canceled = active/trialing/past_due, canceled). Caveats: no personal data, name/email/description are left out (D7 PROVISIONAL); soft-deleted rows dropped (0 today); timestamps UTC as delivered. Constants: cfg_stripe.minor_unit_divisor.
