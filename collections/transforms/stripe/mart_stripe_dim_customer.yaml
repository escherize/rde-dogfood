source:
  query:
    database: neondb
    stages:
    - native: |
        -- One row per: Stripe customer
        -- Key:         customer_id
        -- Sources:     stripe_data.customer, stripe_data.subscription, stripe_transforms.cfg_stripe
        -- Definition:  customer attributes plus subscription counts; no personal data (D7, PROVISIONAL: name, email, description left out)
        -- Caveats:     soft-deleted source rows (_fivetran_deleted) are dropped (0 today); timestamps are UTC as delivered;
        --              subscriptions_not_canceled counts every status except 'canceled' (active, trialing, past_due).
        WITH subs AS (
          SELECT
            s.customer_id,
            COUNT(*)                                           AS subscriptions_total,
            COUNT(*) FILTER (WHERE s.status <> 'canceled')     AS subscriptions_not_canceled,
            COUNT(*) FILTER (WHERE s.status = 'canceled')      AS subscriptions_canceled
          FROM stripe_data.subscription s
          WHERE NOT s._fivetran_deleted
          GROUP BY s.customer_id
        )
        SELECT
          cu.id                                                AS customer_id,
          cu.created                                           AS customer_created_at,
          cu.currency                                          AS customer_currency,
          cu.balance / c.minor_unit_divisor::numeric           AS account_balance_local,
          cu.delinquent                                        AS is_delinquent,
          COALESCE(sb.subscriptions_total, 0)                  AS subscriptions_total,
          COALESCE(sb.subscriptions_not_canceled, 0)           AS subscriptions_not_canceled,
          COALESCE(sb.subscriptions_canceled, 0)               AS subscriptions_canceled,
          COALESCE(sb.subscriptions_total, 0) > 0              AS has_subscription
        FROM stripe_data.customer cu
        CROSS JOIN stripe_transforms.cfg_stripe c
        LEFT JOIN subs sb ON sb.customer_id = cu.id
        WHERE NOT cu._fivetran_deleted
      lib/type: mbql.stage/native
    lib/type: mbql/query
  type: query
