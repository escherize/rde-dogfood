description: |
  Draft, provisional decisions: D3, D4, D5. One row per Stripe invoice (key: invoice_id). Sources: stripe_data.invoice, mart_stripe_dim_subscription, cfg_stripe. Definition: each invoice in local currency and USD with its subscription's plan and product. Revenue invoice = status paid; revenue = amount_paid (D4). Caveats: amounts use the invoice's own currency, not the plan's (they differ on 671 of 848 invoices); USD uses fixed cfg_stripe rates, null for an unlisted currency (D5); is_dated_before_subscription flags invoices created before their subscription (403 of 848 today), flagged, not fixed; soft-deleted rows dropped (0 today); UTC; newest month flagged by is_complete_period. Constants: cfg_stripe.minor_unit_divisor, usd_per_*, last_complete_month.
