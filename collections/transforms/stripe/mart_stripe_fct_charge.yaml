description: |
  Draft, provisional decisions: D3, D5, D6, D7. One row per Stripe charge (key: charge_id). Sources: stripe_data.charge, cfg_stripe. Definition: each charge in local currency and USD with refund, net and cash-collected flag. Cash collected = status succeeded AND paid AND captured; net = charged amount minus refund applied. Caveats: refund = charge.amount_refunded, not the refund table (they disagree on all 20 charges that have refund rows; D6); refund applied is capped at the charged amount and over-refunded charges are flagged (3 today; D7); USD uses fixed cfg_stripe rates, null for an unlisted currency (D5); failed and uncaptured charges stay with is_cash_collected = false, so sum cash only where true; soft-deleted rows dropped (0 today); UTC; newest month flagged by is_complete_period. Constants: cfg_stripe.minor_unit_divisor, usd_per_*, last_complete_month.
