name: Cash collected (USD)
description: 'Self-consistent only, no external reference. Cash received from captured, paid Stripe charges, net of refunds, in USD, by charge month. Excludes failed attempts (109 charges). Net is floored at zero where a refund exceeds the charge (3 charges). Charges start Jul 2024 and carry no invoice id, so this does not reconcile to Revenue. Fixed 2024-average FX. Complete through Dec 2024. Tie-out: recomputed from stripe_data.charge (amount less refund, in cents at the cfg_stripe rates), all 6 months match within 0.05 USD. Owner: not yet assigned (see hand-back).'
