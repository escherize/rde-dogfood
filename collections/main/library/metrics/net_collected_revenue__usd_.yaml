name: Net collected revenue (USD)
description: 'Self-consistent only, no external reference. Money collected from live, succeeded charges minus live, succeeded refunds, per month, in USD only (Stripe has no exchange rates here, so currencies are separate metrics and never added together). Complete months only (through 2024-11; December is partial). Excludes test-mode and loader-deleted records. Revenue is by charge status, not the paid flag. Refunds come from the refund table in their own currency and month, even where the charge is deleted (D7, about 5% of net). Not comparable to accounting revenue. Owner: to be assigned.'
