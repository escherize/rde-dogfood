name: Revenue (USD)
description: 'Self-consistent only, no external reference. Revenue from paid Stripe invoices, in USD, by invoice creation month. Counts amount paid on invoices with status paid; excludes open, void and uncollectible invoices (the largest exclusion: 420 of 848 invoices, 105.5k USD billed vs 105.6k USD recognised). Converted at fixed 2024-average rates, so non-USD months do not restate for FX moves. Not comparable to Cash collected: charges carry no invoice id and the two sources differ (Dec 2024: 9.9k revenue vs 30.4k cash). Not monthly recurring revenue: plans bill daily to yearly. Complete through Dec 2024. Tie-out: recomputed from stripe_data.invoice (amount_paid in cents at the cfg_stripe rates), all 12 months match within 0.03 USD. Owner: bryan@metabase.com.'
