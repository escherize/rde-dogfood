name: Net revenue (USD)
description: 'Reconciled to analytics.mart_stripe_fct_charge on 2026-10-19, to the dollar for each month Jul-Dec 2024 (the older table uses the same fixed FX, so this is a build check, not a finance sign-off). Money collected from succeeded charges minus refunds, in USD at fixed 2024-average FX, by charge month (UTC). Excludes failed charges (109 of 426) and invoices: paid invoices are a separate metric and do not tie to charges (Dec 2024: $30.4k here vs $9.9k paid invoices). Refunds use each charge''s refunded amount, capped at the charge amount, not the refund table (the refund-table reading would add 0.7% to Dec 2024). Complete months only; data ends 2024-12-31. Not comparable to accounting revenue or to MRR. Owner: not yet assigned.'
