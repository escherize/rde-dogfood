    text: '**Definitions.** *Merged PRs*: PRs with a merge date, by month of merge. *Median hours to merge*: merge date minus created date, PRs whose merge date is not before creation (40 of 71). *Median hours to first review*: PR creation to earliest counted review (not pending, not before the PR existed). *CI success rate*: successful runs / runs concluding success, failure or timed out (D11); cancelled, skipped, neutral, action_required and unfinished runs excluded. *Production deployments*: deployments to the environment named production, rollbacks included (D12); the source production flag is ignored. *Change failure rate*: production rollbacks / production deployments (4 of 17).'
    virtual_card:
      display: text
