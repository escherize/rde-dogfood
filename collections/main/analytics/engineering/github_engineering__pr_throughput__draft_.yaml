    text: '**GitHub engineering: PR throughput (Draft).** Data through November 2024 (last complete month; December has one day and is left out). Sampled 2024 extract of raw_github, refreshed daily 03:00 by the rde_github job. Rows the loader flagged deleted (148 of 300 PRs) are excluded. A PR counts as merged when it has a merge date. All numbers: Self-consistent only, no external reference. Opened-PR cards use the created date and are not mapped to the Merged month filter.'
