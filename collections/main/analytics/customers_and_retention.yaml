name: Customers and retention
description: Who the customers are and whether they come back, powered by revenue_customers. A customer is a person (duplicate Shopify accounts merged) with at least one valid order. Repeat = two or more valid orders. Dates are in the shop timezone (US Eastern). No names or emails are shown.
