    text: |
      **Definitions** (first sentence of each metric's description; Self-consistent only, no external reference; D1 to D9 confirmed 2026-10-19)

      - **Pull requests opened**: pull requests opened per month, from the Pull requests opened measure, complete months only.
      - **Pull requests merged**: pull requests merged per month, by `merged_at`, complete months only.
      - **Median hours to merge**: median hours from opened to merged, by month merged. PRs merged before they were created are left out.
      - **CI runs**: GitHub Actions workflow runs per month, complete months only.
      - **CI success rate**: successful runs divided by decided runs (success, failure, timed_out); cancelled, skipped, neutral and empty conclusions are not decided.
      - **Production deployments / rollbacks**: deployments (rollbacks) whose environment is production, per month.
    virtual_card:
      display: text
