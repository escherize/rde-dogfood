    text: |
      **GitHub engineering delivery**

      Data through **November 2024**. The extract ends on 1 Dec 2024, so December (one day of data) is left out of every chart. Refreshed daily at 03:00 UTC by the `rde_github` job from `raw_github`.

      Trust: **Self-consistent only, no external reference.** Definitions D1 to D9 confirmed 2026-10-19: rows Fivetran marks deleted are excluded; a PR is merged when `merged_at` is filled; CI success is conclusion success over decided runs; production means environment = production. Median hours to merge is a data-quality signal (see its card).
