name: How many hours does the median merged pull request take?
description: 'Median hours from opened to merged, by month merged. Rests on 40 PRs; 31 merged PRs with merged_at before created_at are left out. Metric: Median hours to merge. Self-consistent only, no external reference; D1 D2 D3 confirmed 2026-10-19. Values run to thousands of hours because in the source merged_at is not tied to created_at (31 of 71 merged PRs were merged before they were opened); treat as a data-quality signal, not a delivery fact.'
