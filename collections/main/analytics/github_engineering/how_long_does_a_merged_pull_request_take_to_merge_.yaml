name: How long does a merged pull request take to merge?
description: 'Median hours from opened to merged in the latest complete month, against the month before. Excludes PRs merged before they were created. Metric: Median hours to merge. Self-consistent only, no external reference; D1 D2 D3 confirmed 2026-10-19. Values run to thousands of hours because in the source merged_at is not tied to created_at (31 of 71 merged PRs were merged before they were opened); treat as a data-quality signal, not a delivery fact.'
