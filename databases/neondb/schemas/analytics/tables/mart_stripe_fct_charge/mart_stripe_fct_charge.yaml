created_at: '2026-10-14T20:45:26.5733Z'
description: 'One row per Stripe charge attempt (426), Jul-Dec 2024, all amounts also in USD. Includes failed attempts: filter or use the Cash collected measures, which count only captured, paid charges. Owner: bryan@metabase.com.'
