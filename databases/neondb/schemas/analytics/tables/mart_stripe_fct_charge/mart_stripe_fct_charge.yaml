caveats: 'Charges carry no invoice id, so they cannot be matched to invoices: Cash collected and Revenue are different sources and do not reconcile. USD uses fixed 2024-average FX rates (analytics.cfg_stripe). Net amounts are floored at zero when a refund exceeds the charge (3 charges).'
caveats_set: true
